[package]
name = "info-lite"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false
authors = ["Strawberry Interactive LLC"]
description = "Info and news: two texts of the server owner, shown with /info and /news."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sp-lang = { path = "libs/sp-lang" }
sp-pages = { path = "libs/sp-pages" }
strawberry-plugin-api = { version = "=0.2.3", registry = "strawberry" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/sp-lang", "libs/sp-pages"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
